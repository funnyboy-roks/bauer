[package]
name = "bauer-macros"
edition = "2024"

[features]
unlimited_range = []

[lib]
proc-macro = true

[dependencies]
convert_case = "0.11.0"
proc-macro2 = "1.0.103"
quote = "1.0.42"
strum = { version = "0.28.0", features = ["derive"] }
syn = { version = "2.0.111", features = ["extra-traits", "full"] }
